name: Refresh personal profile

on:
  push:
    branches: [main]
    paths:
      - profile.json
      - assets/portrait.png
      - scripts/build_profile.py
      - .github/workflows/profile.yml
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: personal-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refresh public data and render original artwork
        run: python3 scripts/build_profile.py --refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data/github.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile activity [skip ci]'
            git push
          fi
