xt x="360" y="416" fill="#a4b2c1" font-size="13" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >NETWORKS &amp; INFORMATION SYSTEMS</text><text x="850" y="416" fill="#a4b2c1" font-size="13" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >TECH FOR SOCIAL IMPACT</text><g class="float"><path d="M895 122 L1065 186 L1001 322 L831 258 Z" fill="none" stroke="#283643" stroke-width="1.5" /><path d="M895 122 L1001 322 M831 258 L1065 186" fill="none" stroke="#283643" stroke-width="1" /><ellipse cx="948" cy="221" rx="140" ry="91" transform="rotate(-24 948 221)" fill="none" stroke="#435665"/><ellipse cx="948" cy="221" rx="140" ry="91" transform="rotate(-24 948 221)" fill="none" stroke="#b8ff75" class="flow"/><rect x="901" y="175" width="94" height="94" rx="22" fill="#0c1118" stroke="#8baeff" /><text x="918" y="235" fill="#f0f2e9" font-size="38" font-weight="700" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >ML</text><circle cx="895" cy="122" r="18" fill="#0c1118" stroke="#b8ff75"/><text x="895" y="127" fill="#b8ff75" font-size="12" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">01</text><text x="895" y="93" fill="#a4b2c1" font-size="11" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">LEARN</text><circle cx="1065" cy="186" r="18" fill="#0c1118" stroke="#b8ff75"/><text x="1065" y="191" fill="#b8ff75" font-size="12" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">02</text><text x="1065" y="157" fill="#a4b2c1" font-size="11" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">BUILD</text><circle cx="1001" cy="322" r="18" fill="#0c1118" stroke="#b8ff75"/><text x="1001" y="327" fill="#b8ff75" font-size="12" font-weight="500" font-family="'SFMono-Regular',Co