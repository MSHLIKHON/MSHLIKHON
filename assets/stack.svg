e cx="39" cy="240" r="4" fill="#b8ff75" class="pulse"/><text x="53" y="246" fill="#b8ff75" font-size="12" font-weight="500" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >LEARNING</text><text x="167" y="246" fill="#a4b2c1" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" >Software design  /  Networking fundamentals  /  Web security</text>
